    <script>
      (function () {
        var HF = window.HF;

        /* Шрифты должны быть загружены до измерения слов — сборка таймлайна
           внутри fonts.ready; регистрация — после полной сборки. */
        document.fonts.ready.then(function () {
          var tl = gsap.timeline({ paused: true });

          /* ── 0.0–4.2 · заголовок ──────────────────────────── */
          var title = ["#nt-kicker", "#nt-rule", "#nt-hook-1", "#nt-hook-2"];
          HF.hide(tl, title, 0);
          HF.ruleHit(tl, "#nt-rule", 0.3);
          HF.enter(tl, "#nt-kicker", 0.38);
          HF.enterStagger(tl, ["#nt-hook-1", "#nt-hook-2"], 0.46);
          HF.exit(tl, title, 3.66);

          /* ── Кикеры глав ───────────────────────────────────── */
          var chapters = [
            ["#nk1", "#nk1-rule", 4.4, 7.2],
            ["#nk2", "#nk2-rule", 16.6, 19.4],
            ["#nk3", "#nk3-rule", 31.1, 33.9],
            ["#nk4", "#nk4-rule", 56.5, 59.3],
            ["#nk5", "#nk5-rule", 75.64, 78.44],
            ["#nk6", "#nk6-rule", 100.04, 102.84],
          ];
          chapters.forEach(function (k) {
            HF.hide(tl, [k[0], k[1]], 0);
            HF.ruleHit(tl, k[1], k[2]);
            HF.enter(tl, k[0], k[2] + HF.M.step);
            HF.exit(tl, [k[0], k[1]], k[3] - 0.3);
          });

          /* ── Субтитры-караоке ─────────────────────────────────
             Слова из window.__WIPE_DATA: text/start/end по речи.
             Фраза появляется целиком в момент первого слова, каждое
             слово подсвечивается акцентом ровно тогда, когда звучит.
             Смена фраз — жёсткая, размер шрифта единый. */
          var D = window.__WIPE_DATA;
          var WORDS = D.words;
          var GROUPS = D.groups;

          var container = document.getElementById("wp-container");
          GROUPS.forEach(function (g, gi) {
            var groupWords = WORDS.slice(g[0], g[1] + 1);
            var grp = document.createElement("div");
            grp.className = "wp-group";
            grp.id = "wp-grp-" + gi;
            var wordEls = [];
            groupWords.forEach(function (w, i) {
              var span = document.createElement("span");
              span.className = "wp-word";
              span.id = "wp-w-" + (g[0] + i);
              span.textContent = w.text.toUpperCase();
              grp.appendChild(span);
              wordEls.push(span);
            });
            container.appendChild(grp);

            var gStart = groupWords[0].start;
            var gEnd = groupWords[groupWords.length - 1].end + 0.55;
            var next = GROUPS[gi + 1];
            if (next) {
              gEnd = Math.min(gEnd, WORDS[next[0]].start - 0.05);
            }

            tl.set(grp, { visibility: "visible" }, gStart);
            groupWords.forEach(function (w, i) {
              tl.to(wordEls[i], { color: "#e0dd1f", duration: 0.12, ease: "none" }, w.start);
            });
            tl.set(grp, { visibility: "hidden" }, gEnd);
          });

          /* ── 103.4+ · итоговые плашки ──────────────────────── */
          HF.hide(tl, ["#np1", "#np2"], 0);
          HF.enter(tl, "#np1", 103.4);
          HF.exit(tl, "#np1", 106.6);
          HF.enter(tl, "#np2", 107.1);
          HF.exit(tl, "#np2", 109.3);

          window.__timelines["main"] = tl;
        });
      })();
    </script>
